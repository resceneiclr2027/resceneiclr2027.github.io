<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 575" role="img" aria-labelledby="title desc">
  <title id="title">Mobile comparison of both-world action and question-answering results</title>
  <desc id="desc">Paper Tables 3 and 9 on 1195 authored pairs. Action pass: factual replay 23.68 percent, direct conditioning 36.15 percent, RESCENE 42.85 percent. QA correct: factual replay 4.60 percent, direct conditioning 14.56 percent, RESCENE 6.69 percent. Higher is better.</desc>
  <rect width="380" height="575" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1d3044">
    <text x="20" y="30" fill="#24558a" font-size="11" font-weight="700" letter-spacing=".7">PAPER TABLES 3 + 9 · 1,195 PAIRS</text>
    <text x="20" y="71" font-size="18" font-weight="700">Both-world action pass ↑</text>
    <text x="20" y="93" fill="#536477" font-size="12">Same factual and edited world must pass</text>
    <g font-size="13" font-weight="700">
      <text x="20" y="127">Factual replay</text><text x="352" y="127" text-anchor="end">23.68%</text>
      <text x="20" y="184">Direct conditioning</text><text x="352" y="184" text-anchor="end">36.15%</text>
      <text x="20" y="241" fill="#24558a">RESCENE</text><text x="352" y="241" text-anchor="end" fill="#24558a">42.85%</text>
    </g>
    <g fill="#edf1f4"><rect x="20" y="138" width="332" height="12" rx="2"/><rect x="20" y="195" width="332" height="12" rx="2"/><rect x="20" y="252" width="332" height="12" rx="2"/></g>
    <rect x="20" y="138" width="157.2" height="12" rx="2" fill="#8997a4"/>
    <rect x="20" y="195" width="240.0" height="12" rx="2" fill="#a35c54"/>
    <rect x="20" y="252" width="284.5" height="12" rx="2" fill="#24558a"/>
    <path d="M20 297H360" stroke="#d9e0e6"/>
    <text x="20" y="332" font-size="18" font-weight="700">Both-world QA correct ↑</text>
    <text x="20" y="354" fill="#536477" font-size="12">Both generated count answers must be correct</text>
    <g font-size="13" font-weight="700">
      <text x="20" y="389">Factual replay</text><text x="352" y="389" text-anchor="end">4.60%</text>
      <text x="20" y="446" fill="#884b44">Direct conditioning</text><text x="352" y="446" text-anchor="end" fill="#884b44">14.56%</text>
      <text x="20" y="503">RESCENE</text><text x="352" y="503" text-anchor="end">6.69%</text>
    </g>
    <g fill="#edf1f4"><rect x="20" y="400" width="332" height="12" rx="2"/><rect x="20" y="457" width="332" height="12" rx="2"/><rect x="20" y="514" width="332" height="12" rx="2"/></g>
    <rect x="20" y="400" width="76.4" height="12" rx="2" fill="#8997a4"/>
    <rect x="20" y="457" width="241.7" height="12" rx="2" fill="#a35c54"/>
    <rect x="20" y="514" width="111.1" height="12" rx="2" fill="#24558a"/>
    <text x="20" y="557" fill="#536477" font-size="12">Each panel has its own stated percentage scale.</text>
  </g>
</svg>
